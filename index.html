<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TheGate — Project Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; color: #1a1a2e; background: #f5f5fa; min-height: 100vh; }

  .hdr { background: #1a1a2e; color: white; padding: 32px 32px 28px; position: relative; overflow: hidden; }
  .hdr::before { content:''; position:absolute; top:-40px; right:-40px; width:200px; height:200px; border-radius:50%; background:rgba(0,87,184,0.15); }
  .hdr-eye { font-family: 'DM Mono', monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,0.45); margin-bottom:8px; }
  .hdr h1 { font-family: 'DM Serif Display', serif; font-size:32px; font-weight:400; color:white; line-height:1.1; }
  .hdr h1 em { font-style:italic; color:rgba(255,255,255,0.5); }
  .hdr-sub { font-size:13px; color:rgba(255,255,255,0.45); margin-top:6px; }
  .hdr-stats { display:flex; gap:28px; margin-top:20px; flex-wrap:wrap; }
  .stat-num { font-family: 'DM Serif Display', serif; font-size:28px; color:white; line-height:1; }
  .stat-lbl { font-size:11px; color:rgba(255,255,255,0.4); text-transform:uppercase; letter-spacing:.08em; margin-top:3px; }
  .sync-badge { font-size:11px; color:rgba(255,255,255,0.4); font-family:'DM Mono',monospace; align-self:flex-end; padding-bottom:4px; }
  .pbar-wrap { margin-top:18px; background:rgba(255,255,255,0.12); border-radius:99px; height:3px; overflow:hidden; }
  .pbar-fill { height:100%; background:#4a9eff; border-radius:99px; transition:width .6s ease; }

  .lock-bar { display:flex; align-items:center; gap:10px; padding:12px 32px; background:#f0f0f5; border-bottom:1px solid #dddde8; font-size:13px; flex-wrap:wrap; }
  .lock-bar.unlocked { background:#e6f4ed; }
  .lock-icon { font-size:16px; color:#6b6b85; }
  .lock-bar.unlocked .lock-icon { color:#1a7a4a; }
  .lock-status { flex:1; color:#6b6b85; min-width:160px; }
  .lock-status.unlocked { color:#1a7a4a; }
  .lock-input { font-size:13px; padding:6px 10px; border-radius:8px; border:1px solid #dddde8; background:white; color:#1a1a2e; width:140px; font-family:'DM Sans',sans-serif; }
  .lock-input:focus { outline:none; border-color:#0057b8; }
  .lock-btn { font-size:13px; padding:6px 14px; border-radius:8px; border:1px solid #dddde8; background:white; color:#1a1a2e; cursor:pointer; font-family:'DM Sans',sans-serif; }
  .lock-btn:hover { background:#f0f0f5; }
  .relock-btn { font-size:13px; padding:6px 14px; border-radius:8px; border:1px solid #b8dfc9; background:white; color:#1a7a4a; cursor:pointer; display:none; align-items:center; gap:6px; font-family:'DM Sans',sans-serif; }
  .relock-btn:hover { background:#d4eedd; }
  .lock-err { font-size:12px; color:#c0392b; }

  .main { max-width:860px; margin:0 auto; padding:20px 24px 60px; }
  .sec-lbl { font-family:'DM Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:#6b6b85; padding:20px 0 8px; display:flex; align-items:center; gap:10px; }
  .sec-lbl::after { content:''; flex:1; height:1px; background:#dddde8; }

  .phase { background:white; border-radius:12px; margin-bottom:8px; border:1px solid #dddde8; overflow:hidden; transition:box-shadow .2s; }
  .phase:hover { box-shadow:0 2px 12px rgba(0,0,0,0.06); }
  .phase.done { border-color:#b8dfc9; background:#fafffe; }
  .phase.active { border-color:#a8c4e8; background:#fafcff; }

  .phase-hdr { display:flex; align-items:center; gap:12px; padding:14px 16px; cursor:pointer; user-select:none; }
  .phase-num { font-family:'DM Mono',monospace; font-size:11px; color:#6b6b85; min-width:24px; }
  .phase-check { width:20px; height:20px; border-radius:50%; border:1.5px solid #dddde8; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .2s; background:white; cursor:default; }
  .phase-check.editable { cursor:pointer; }
  .phase-check.editable:hover { border-color:#0057b8; }
  .phase-check.checked { background:#1a7a4a; border-color:#1a7a4a; color:white; font-size:11px; }
  .phase-check.inprogress { background:#e8f0fb; border-color:#0057b8; color:#0057b8; font-size:9px; }
  .phase-title { flex:1; font-size:14px; font-weight:500; color:#1a1a2e; }
  .phase.done .phase-title { color:#1a7a4a; }
  .phase-tag { font-size:11px; padding:2px 8px; border-radius:99px; font-weight:500; white-space:nowrap; font-family:'DM Mono',monospace; }
  .tag-done { background:#e6f4ed; color:#1a7a4a; }
  .tag-next { background:#e8f0fb; color:#0057b8; }
  .tag-upcoming { background:#e8e8f0; color:#6b6b85; }
  .tag-heavy { background:#fef3e2; color:#a05c00; }
  .phase-arrow { font-size:11px; color:#6b6b85; flex-shrink:0; }

  .phase-body { display:none; padding:0 16px 16px 52px; border-top:1px solid #dddde8; }
  .phase-body.open { display:block; }
  .phase-desc { font-size:13px; color:#6b6b85; line-height:1.6; margin-top:12px; }
  .task-list { margin:10px 0 0 14px; }
  .task-list li { font-size:13px; color:#6b6b85; line-height:1.8; }

  .status-row { display:flex; gap:6px; margin-top:14px; flex-wrap:wrap; }
  .sbtn { font-size:12px; padding:4px 12px; border-radius:99px; border:1px solid #dddde8; background:#f0f0f5; color:#6b6b85; cursor:default; opacity:0.5; font-family:'DM Sans',sans-serif; }
  .sbtn.editable { cursor:pointer; opacity:1; }
  .sbtn.editable:hover { background:white; }
  .sbtn.active-todo { background:#e8e8f0; color:#1a1a2e; border-color:#9999aa; opacity:1; font-weight:500; }
  .sbtn.active-progress { background:#e8f0fb; color:#0057b8; border-color:#a8c4e8; opacity:1; font-weight:500; }
  .sbtn.active-done { background:#e6f4ed; color:#1a7a4a; border-color:#b8dfc9; opacity:1; font-weight:500; }

  .note-lbl { font-size:11px; color:#6b6b85; text-transform:uppercase; letter-spacing:.08em; margin-top:14px; margin-bottom:4px; font-family:'DM Mono',monospace; }
  .note-area { width:100%; border:1px solid #dddde8; border-radius:8px; padding:8px 10px; font-size:13px; font-family:'DM Sans',sans-serif; color:#1a1a2e; background:#f5f5fa; resize:vertical; min-height:60px; cursor:default; }
  .note-area.editable { background:white; cursor:text; }
  .note-area:focus { outline:none; border-color:#0057b8; }

  .save-toast { position:fixed; bottom:20px; right:20px; background:#1a1a2e; color:white; font-size:12px; padding:8px 14px; border-radius:8px; opacity:0; transform:translateY(6px); transition:all .3s; pointer-events:none; font-family:'DM Mono',monospace; z-index:999; }
  .save-toast.show { opacity:1; transform:translateY(0); }
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-eye">YWAM Perth · ywamperth/thegate</div>
  <h1>The<em>Gate</em> — Build Plan</h1>
  <p class="hdr-sub">Next.js · Supabase · Vercel · Square · Resend</p>
  <div class="hdr-stats">
    <div><div class="stat-num" id="stat-done">0</div><div class="stat-lbl">Phases done</div></div>
    <div><div class="stat-num">16</div><div class="stat-lbl">Total phases</div></div>
    <div><div class="stat-num" id="stat-pct">0%</div><div class="stat-lbl">Complete</div></div>
    <div class="sync-badge" id="sync-badge"></div>
  </div>
  <div class="pbar-wrap"><div class="pbar-fill" id="pbar" style="width:0%"></div></div>
</div>

<div class="lock-bar" id="lock-bar">
  <i class="ti ti-lock lock-icon" id="lock-icon"></i>
  <span class="lock-status" id="lock-status">View only — enter password to edit</span>
  <input class="lock-input" type="password" id="pw-input" placeholder="Password..." onkeydown="if(event.key==='Enter')tryUnlock()" />
  <button class="lock-btn" id="unlock-btn" onclick="tryUnlock()">Unlock</button>
  <button class="relock-btn" id="relock-btn" onclick="doLock()">
    <i class="ti ti-lock"></i> Lock
  </button>
  <span class="lock-err" id="lock-err"></span>
</div>

<div class="main" id="main-content"></div>

<div class="save-toast" id="save-toast">Saved ✓</div>

<script>
var PASS = 'tgpw';
var unlocked = false;
var states = {};
var notes = {};

var phases = [
  { id:'phase-1', num:'01', title:'Supabase schema + RLS policies', tag:'done', section:'Foundation',
    desc:'All 23 database tables created and Row Level Security policies applied. The data structure and security foundation for the entire application.',
    tasks:['23 tables created in Supabase','Full RLS policies on every table','Helper functions: is_rego(), is_leader()','Data sensitivity levels defined per table'] },
  { id:'phase-2', num:'02', title:'Authentication', tag:'done', section:null,
    desc:'Login, logout, session management using the with-supabase template. proxy.ts protecting routes.',
    tasks:['with-supabase template installed','proxy.ts created (replaces middleware.ts)','getClaims() used for all server auth checks','Login and logout working'] },
  { id:'phase-3', num:'03', title:'Registration + Square payment', tag:'done', section:null,
    desc:'Public registration page where new students sign up, pay $30 AUD via Square, and receive an invitation email.',
    tasks:['Registration form: name, email, phone, program','Square Web Payments SDK integration','$30 AUD payment processing','Creates persons + applications + payments records','Sends invite email via Supabase auth'] },
  { id:'phase-4', num:'04', title:'Student application form', tag:'done', section:null,
    desc:'6-tab application form for students to complete after registering. Smart auto-save after 5 seconds of inactivity.',
    tasks:['Tab 1: Personal details','Tab 2: Contact & family','Tab 3: Education & DTS history','Tab 4: Health & medical','Tab 5: Faith questions','Tab 6: References & submit','Smart auto-save (5s pause + tab change)','Load/save from Supabase'] },
  { id:'phase-5', num:'05', title:'Reference request system', tag:'upcoming', section:'Portal features',
    desc:'Referees receive an email with a unique link to fill in their reference form. No login required.',
    tasks:['Generate unique token per referee','Send email with token link','Public referee form at /referee/[token]','Save referee response to Supabase','Notify student when both references received'] },
  { id:'phase-6', num:'06', title:'Admin dashboard', tag:'upcoming', section:null,
    desc:'Registration office view of all applicants. Filter by program, status, flags.',
    tasks:['Applicant list with search + filter','Application status overview','Quick-action buttons','Export to CSV'] },
  { id:'phase-7', num:'07', title:'Leader dashboards', tag:'upcoming', section:null,
    desc:'Program leaders can view applicants assigned to their program only.',
    tasks:['Leader login + role check','Filtered applicant list (assigned programs only)','Read-only application view','Notes visible to leaders'] },
  { id:'phase-8', num:'08', title:'Three application views', tag:'upcoming', section:null,
    desc:'Three role-specific views of an application: student view, rego office view, and leader view.',
    tasks:['Student view: own application, read-only after submit','Rego view: full application + notes + flags','Leader view: application minus sensitive health data'] },
  { id:'phase-9', num:'09', title:'Pre-arrival steps + documents', tag:'upcoming', section:null,
    desc:'Checklist of tasks students must complete before arriving. Document uploads.',
    tasks:['Pre-arrival checklist per program','Document upload (passport, insurance, etc.)','Rego can mark steps complete','Progress visible to student'] },
  { id:'phase-10', num:'10', title:'Staff application form', tag:'heavy', section:null,
    desc:'Separate application flow for YWAM staff applicants. Different fields from student form.',
    tasks:['Staff-specific form fields','Separate RLS policies for staff applications','Admin view of staff applications'] },
  { id:'phase-11', num:'11', title:'Email notification system', tag:'upcoming', section:'Notifications',
    desc:'Transactional emails via Resend for key application events.',
    tasks:['Set up Resend integration','Application submitted notification','Reference received notification','Status change notifications','Pre-arrival step reminders'] },
  { id:'phase-12', num:'12', title:'Questionnaire management', tag:'upcoming', section:null,
    desc:'Rego office can manage the faith questions shown on the application form.',
    tasks:['Question CRUD interface for rego','Version history for questions','Questions linked to program type'] },
  { id:'phase-13', num:'13', title:'Red flag system', tag:'upcoming', section:'Safety',
    desc:'Rego and leaders can flag applications for follow-up. Never visible to the applicant.',
    tasks:['Two levels: Red flag and Watch','Flag banner on all app views','Resolved flags kept in history','NEVER visible to the applicant'] },
  { id:'phase-14', num:'14', title:'English proficiency country settings', tag:'upcoming', section:null,
    desc:'Admin-managed list of countries requiring English proficiency documentation.',
    tasks:['Country list managed by rego','Warning on registration for flagged countries','Per-applicant manual override','Triggers English proficiency pre-arrival step'] },
  { id:'phase-15', num:'15', title:'Data migration from SQL Server 2019', tag:'heavy', section:'Go-live',
    desc:'Migrate all existing applicant data from the old system into Supabase.',
    tasks:['Connect to SQL Server 2019','Read and inspect old data structure','Map old fields to new schema','Run migration on test Supabase first','Verify all data correct','Run on production'] },
  { id:'phase-16', num:'16', title:'Security audit + testing + go-live', tag:'upcoming', section:null,
    desc:'Final testing, security audit, connect production domain, go live.',
    tasks:['Full RLS policy audit','Test all three roles','Test on mobile devices','Connect secure.ywamperth.org.au to Vercel','Upgrade Supabase to Pro','Train rego office staff','Go live!'] },
];

function tagClass(t) {
  if(t==='done') return 'tag-done';
  if(t==='heavy') return 'tag-heavy';
  if(t==='next') return 'tag-next';
  return 'tag-upcoming';
}
function tagText(t) {
  if(t==='done') return 'Done';
  if(t==='heavy') return 'Heavy';
  if(t==='next') return 'Up next';
  return 'Upcoming';
}

function buildHTML() {
  var html = '';
  phases.forEach(function(p) {
    if(p.section) html += '<div class="sec-lbl">'+p.section+'</div>';
    var st = states[p.id] || 'todo';
    var phaseClass = st==='done' ? 'phase done' : st==='progress' ? 'phase active' : 'phase';
    var checkClass = 'phase-check' + (st==='done' ? ' checked' : st==='progress' ? ' inprogress' : '') + (unlocked ? ' editable' : '');
    var checkContent = st==='done' ? '✓' : st==='progress' ? '●' : '';
    var currentTag = st==='done' ? 'done' : st==='progress' ? 'next' : p.tag;
    var currentTagText = st==='done' ? 'Done' : st==='progress' ? 'In progress' : tagText(p.tag);
    var n = (notes[p.id] || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    var tasks = p.tasks.map(function(t){ return '<li>'+t+'</li>'; }).join('');
    var todoA = st==='todo' ? ' active-todo' : '';
    var progA = st==='progress' ? ' active-progress' : '';
    var doneA = st==='done' ? ' active-done' : '';
    var btnE = unlocked ? ' editable' : '';

    html += '<div class="'+phaseClass+'" id="'+p.id+'">';
    html += '<div class="phase-hdr" onclick="togglePhase(\''+p.id+'\')">';
    html += '<span class="phase-num">'+p.num+'</span>';
    html += '<div class="'+checkClass+'" onclick="event.stopPropagation();cycleCheck(\''+p.id+'\')">'+checkContent+'</div>';
    html += '<span class="phase-title">'+p.title+'</span>';
    html += '<span class="phase-tag '+tagClass(currentTag)+'">'+currentTagText+'</span>';
    html += '<span class="phase-arrow" id="arr-'+p.id+'">▸</span>';
    html += '</div>';
    html += '<div class="phase-body" id="body-'+p.id+'">';
    html += '<p class="phase-desc">'+p.desc+'</p>';
    html += '<ul class="task-list">'+tasks+'</ul>';
    html += '<div class="status-row">';
    html += '<button class="sbtn'+btnE+todoA+'" onclick="setStatus(\''+p.id+'\',\'todo\')">To do</button>';
    html += '<button class="sbtn'+btnE+progA+'" onclick="setStatus(\''+p.id+'\',\'progress\')">In progress</button>';
    html += '<button class="sbtn'+btnE+doneA+'" onclick="setStatus(\''+p.id+'\',\'done\')">Done</button>';
    html += '</div>';
    html += '<div class="note-lbl">Notes</div>';
    html += '<textarea class="note-area'+(unlocked?' editable':'')+'" id="note-'+p.id+'" placeholder="Add notes here..."'+(unlocked?'':' readonly')+' oninput="queueSave()">'+n+'</textarea>';
    html += '</div></div>';
  });
  document.getElementById('main-content').innerHTML = html;
  updateStats();
}

function togglePhase(id) {
  var body = document.getElementById('body-'+id);
  var arr = document.getElementById('arr-'+id);
  var open = body.classList.contains('open');
  body.classList.toggle('open', !open);
  arr.textContent = open ? '▸' : '▾';
}

function cycleCheck(id) {
  if(!unlocked) return;
  var cur = states[id] || 'todo';
  setStatus(id, cur==='done' ? 'todo' : 'done');
}

function setStatus(id, status) {
  if(!unlocked) return;
  states[id] = status;
  buildHTML();
  queueSave();
}

function updateStats() {
  var done = 0;
  phases.forEach(function(p){ if((states[p.id]||'todo')==='done') done++; });
  document.getElementById('stat-done').textContent = done;
  var pct = Math.round((done/16)*100);
  document.getElementById('stat-pct').textContent = pct+'%';
  document.getElementById('pbar').style.width = pct+'%';
}

function tryUnlock() {
  var val = document.getElementById('pw-input').value;
  if(val === PASS) {
    unlocked = true;
    document.getElementById('lock-bar').classList.add('unlocked');
    document.getElementById('lock-icon').className = 'ti ti-lock-open lock-icon';
    document.getElementById('lock-status').textContent = 'Edit mode — changes save automatically';
    document.getElementById('lock-status').classList.add('unlocked');
    document.getElementById('pw-input').style.display = 'none';
    document.getElementById('unlock-btn').style.display = 'none';
    document.getElementById('relock-btn').style.display = 'flex';
    document.getElementById('lock-err').textContent = '';
    buildHTML();
  } else {
    document.getElementById('lock-err').textContent = 'Incorrect password';
    document.getElementById('pw-input').value = '';
  }
}

function doLock() {
  unlocked = false;
  document.getElementById('lock-bar').classList.remove('unlocked');
  document.getElementById('lock-icon').className = 'ti ti-lock lock-icon';
  document.getElementById('lock-status').textContent = 'View only — enter password to edit';
  document.getElementById('lock-status').classList.remove('unlocked');
  document.getElementById('pw-input').style.display = '';
  document.getElementById('pw-input').value = '';
  document.getElementById('unlock-btn').style.display = '';
  document.getElementById('relock-btn').style.display = 'none';
  buildHTML();
}

var saveTimer = null;
function queueSave() {
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 1000);
}

function doSave() {
  var notesNow = {};
  phases.forEach(function(p){ var el = document.getElementById('note-'+p.id); if(el) notesNow[p.id] = el.value; });
  notes = notesNow;
  try {
    localStorage.setItem('thegate-tracker-data', JSON.stringify({ states: states, notes: notes }));
    showToast('Saved ✓');
    document.getElementById('sync-badge').textContent = 'Saved ' + new Date().toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'});
  } catch(e) { showToast('Save failed'); }
}

function loadData() {
  try {
    var raw = localStorage.getItem('thegate-tracker-data');
    if(raw) {
      var data = JSON.parse(raw);
      states = data.states || {};
      notes = data.notes || {};
    } else {
      states = { 'phase-1':'done','phase-2':'done','phase-3':'done','phase-4':'done' };
    }
  } catch(e) {
    states = { 'phase-1':'done','phase-2':'done','phase-3':'done','phase-4':'done' };
  }
  buildHTML();
}

function showToast(msg) {
  var t = document.getElementById('save-toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 1800);
}

loadData();
</script>
</body>
</html>
